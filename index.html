<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Гайд по покупкам · Айнур Каримова</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F4F3EF; --card:#FFFFFF; --ink:#1B1717; --ink-2:#5E5856; --ink-3:#8F8784;
  --line:rgba(27,23,23,.09); --fill:#ECEAE4; --red:#810100; --red-soft:#F4E6E4;
  --r-lg:22px; --r-md:14px;
  --serif:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --tabbar-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));overscroll-behavior-y:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
[hidden]{display:none!important}

/* brand header */
.brandbar{padding:18px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand-city{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.brand-name{font:500 26px/1.15 var(--serif);margin:4px 0 0;letter-spacing:-.01em}
.brand-name i{color:var(--red);font-style:italic}
.lead{margin:8px 0 0;color:var(--ink-2);font-size:14px;max-width:46ch}

.count{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 12px}

/* home: category tiles */
/* бегущая лента категорий */
.cat-band{margin:8px -16px 0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cat-band::-webkit-scrollbar{display:none}
.cat-grid{display:flex;gap:12px;padding:4px 16px 8px;width:max-content}
.cat-tile{position:relative;flex:0 0 auto;width:156px;height:196px;border-radius:28px;overflow:hidden;border:0;padding:0;cursor:pointer;background:#EEECE8 center/cover no-repeat;display:block;text-align:left;transition:transform .2s;box-shadow:0 6px 18px rgba(27,23,23,.08)}
@media (min-width:620px){.cat-tile{width:190px;height:236px}}
.cat-tile:active{transform:scale(.96)}
.cat-tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,23,23,0) 45%,rgba(27,23,23,.7) 100%)}
.cat-tile-name{position:absolute;left:16px;right:14px;bottom:16px;z-index:1;color:#fff;font:500 22px/1.05 var(--serif);letter-spacing:-.01em}

/* плашки магазинов */
.store-row-wrap{padding-bottom:16px}
.store-scroller{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.store-scroller{grid-template-columns:repeat(4,minmax(0,1fr))}}
.store-chip{border:0;background:var(--card);border-radius:20px;height:72px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 15px/1.2 var(--sans);letter-spacing:.01em;color:var(--ink);cursor:pointer;text-align:left;box-shadow:0 1px 0 var(--line)}
.store-chip::after{content:"";width:8px;height:8px;border-top:1.6px solid var(--ink-3);border-right:1.6px solid var(--ink-3);transform:rotate(45deg);flex-shrink:0}
.store-chip:active{background:var(--fill)}
.store-chip:nth-child(4n+1){background:var(--ink);color:#fff}
.store-chip:nth-child(4n+1)::after{border-color:rgba(255,255,255,.7)}
.store-chip.on,.store-chip.on:nth-child(4n+1){background:var(--red);color:#fff}
.store-chip.on::after{border-color:#fff}
.cat-tile.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--red)}
.cat-tile.on .cat-tile-name::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:#fff;margin-bottom:8px}
.cat-band{padding-top:4px}
#results{scroll-margin-top:12px}

/* browse view */
.browse-top{display:flex;align-items:center;gap:10px;padding-top:8px}
.back{border:0;background:none;color:var(--ink-2);font:500 14px/1 var(--sans);cursor:pointer;padding:8px 0;display:flex;align-items:center;gap:4px}
.sort{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font:500 13px/1 var(--sans);color:var(--ink-2);appearance:none;-webkit-appearance:none;cursor:pointer}
.subs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px;margin:0}
.subs::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font:500 13px/1 var(--sans);color:var(--ink-2);white-space:nowrap;cursor:pointer;flex-shrink:0}
.chip.on{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.chip .x{margin-left:6px;opacity:.7}
.active-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 0 4px;margin:0}
.active-row::-webkit-scrollbar{display:none}

/* cards */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding-bottom:28px}
@media (max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{position:relative;background:var(--card);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;border:1px solid transparent;cursor:pointer;text-align:left;padding:0;transition:border-color .2s,transform .2s}
.card:active{transform:scale(.985)}
@media (hover:hover){.card:hover{border-color:var(--red);transform:translateY(-2px)}}
.pic{position:relative;aspect-ratio:3/4;background:#EEECE8;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.pic img.ok{opacity:1}
.badges{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.badge{font:600 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink)}
.badge.sale{background:var(--red);color:#fff}
.badge.trend{color:var(--red)}
.heart{position:absolute;right:8px;top:8px;z-index:2;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer}
.heart svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:1.8}
.heart.on svg{fill:var(--red);stroke:var(--red)}
.card .body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:3px;flex:1}
.store{font:600 10.5px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.card h3{font:600 14px/1.3 var(--sans);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.col{font-size:12.5px;color:var(--ink-3)}
.row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.price{font:600 15px/1 var(--sans);color:var(--red);font-variant-numeric:tabular-nums}
.old{font-size:12px;color:var(--ink-3);text-decoration:line-through;font-variant-numeric:tabular-nums}

/* empty / states */
.state{text-align:center;padding:60px 20px;color:var(--ink-2)}
.state h2{font:500 32px/1.05 var(--serif);margin:0 0 10px;color:var(--ink)}
.state p{margin:0 auto 18px;max-width:40ch}
.cta{display:inline-block;border:0;background:var(--red);color:#fff;border-radius:999px;padding:13px 22px;font:600 15px/1 var(--sans);text-decoration:none;cursor:pointer}
.ghost{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:11px 18px;font:500 14px/1 var(--sans);cursor:pointer}
.skel{background:linear-gradient(90deg,#ECEAE4 0,#F4F3EF 50%,#ECEAE4 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(244,243,239,.92);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{position:relative;flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tabbar-h);cursor:pointer;color:var(--ink-3)}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7}
.tab.on{color:var(--red)}
.tab.on svg{stroke:var(--red)}
.tab b{position:absolute;top:8px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:999px;min-width:16px;height:16px;padding:0 4px;font:600 10px/16px var(--sans);text-align:center}

/* sheets */
.veil{position:fixed;inset:0;background:rgba(27,23,23,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(27,23,23,.15)}
.sheet.on{transform:none}
@media (min-width:760px){.sheet{left:50%;width:560px;margin-left:-280px}}
.grab{width:38px;height:5px;border-radius:9px;background:rgba(27,23,23,.18);margin:8px auto 2px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 10px}
.sheet-h h2{font:500 28px/1 var(--serif);margin:0}
.link{border:0;background:none;color:var(--red);font:500 14px/1 var(--sans);cursor:pointer;padding:8px 0}
.sheet-b{overflow-y:auto;padding:4px 18px 16px;-webkit-overflow-scrolling:touch}
.fgroup{padding:14px 0;border-top:1px solid var(--line)}
.fgroup:first-child{border-top:0}
.fgroup h4{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts .chip small{color:var(--ink-3);margin-left:4px;font-weight:500}
.opts .chip.on small{color:var(--red)}
.opts .chip[disabled]{opacity:.4;cursor:default}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw{position:relative;width:46px;height:28px;border-radius:999px;background:var(--fill);border:0;cursor:pointer;transition:background .2s;flex-shrink:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--red)}
.sw.on::after{transform:translateX(18px)}
.sheet-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.sheet-f .cta{width:100%;text-align:center}

/* item detail */
.detail .pic{aspect-ratio:3/4;border-radius:var(--r-lg);max-height:52vh;margin:0 auto;width:auto}
.detail .pic img{opacity:1}
.d-store{margin-top:14px}
.d-name{font:600 19px/1.3 var(--sans);margin:4px 0 2px}
.d-price{display:flex;align-items:baseline;gap:8px;margin:10px 0}
.d-price .price{font-size:20px}
.facts{background:var(--card);border-radius:var(--r-md);padding:4px 14px;margin:12px 0}
.facts div{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.facts div:first-child{border-top:0}
.facts b{min-width:92px;font-weight:600;color:var(--ink)}
.facts span{color:var(--ink-2)}
.note{background:var(--red-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;margin:12px 0}
.note b{color:var(--red)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--red);background:var(--red-soft);padding:6px 9px;border-radius:999px}
.fine{font-size:12px;color:var(--ink-3);margin:14px 0 0}
.d-actions{display:flex;gap:10px;align-items:center}
.d-wish{border:1px solid var(--line);background:var(--card);border-radius:999px;width:46px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.d-wish svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:1.8}
.d-wish.on svg{fill:var(--red);stroke:var(--red)}

footer{padding:10px 0 40px;color:var(--ink-3);font-size:12.5px;text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <div class="brandbar">
    <div>
      <div class="brand-city" id="brandCity">Astana</div>
      <div class="brand-name">Shopping Guide <i>by Ainur Karimov</i></div>
      <p class="lead" id="lead">Вещи из наших магазинов, стильные и актуальные на несколько сезонов вперёд.</p>
    </div>
  </div>
</div>

<main class="wrap" id="appMain">
  <div id="state"></div>

  <!-- главная: лента категорий, магазины и товары на одной странице -->
  <section id="home" hidden>
    <div class="count">Категории</div>
    <div class="cat-band" id="catBand"><div class="cat-grid" id="catGrid"></div></div>
    <div class="store-row-wrap">
      <div class="count">Магазины</div>
      <div class="store-scroller" id="storeScroller"></div>
    </div>
    <div id="results">
      <div class="count" id="count"></div>
      <div class="subs" id="subs"></div>
      <div class="active-row" id="activeRow" hidden></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- wishlist -->
  <section id="listView" hidden>
    <div class="count">Список покупок</div>
    <div class="grid" id="listGrid"></div>
  </section>
</main>

<footer class="wrap" id="foot" hidden>Цены и наличие указаны на момент подборки и могут меняться. Фото — с сайтов магазинов.</footer>

<nav class="tabbar" id="tabbar" hidden>
  <button class="tab on" id="tabShop" type="button" aria-label="Ассортимент">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
  </button>
  <button class="tab" id="tabFilters" type="button" aria-label="Фильтры">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    <b id="fcount" hidden>0</b>
  </button>
  <button class="tab" id="tabList" type="button" aria-label="Список покупок">
    <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9.5-8.9C.7 7.6 2.4 4 6 4c2 0 3.5 1.1 4.5 2.4C11.5 5.1 13 4 15 4c3.6 0 5.3 3.6 3.5 7.1C19 15.4 12 20 12 20z"/></svg>
    <b id="lcount" hidden>0</b>
  </button>
</nav>

<div class="veil" id="veil"></div>

<section class="sheet" id="fsheet" aria-label="Фильтры" aria-hidden="true">
  <div class="grab"></div>
  <div class="sheet-h"><h2>Фильтры</h2><button class="link" id="reset" type="button">Сбросить</button></div>
  <div class="sheet-b" id="fbody"></div>
  <div class="sheet-f"><button class="cta" id="apply" type="button">Показать</button></div>
</section>

<section class="sheet detail" id="dsheet" aria-label="Карточка вещи" aria-hidden="true">
  <div class="grab"></div>
  <div class="sheet-b" id="dbody"></div>
  <div class="sheet-f">
    <div class="d-actions">
      <button class="d-wish" id="dWish" type="button" aria-label="В список покупок">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9.5-8.9C.7 7.6 2.4 4 6 4c2 0 3.5 1.1 4.5 2.4C11.5 5.1 13 4 15 4c3.6 0 5.3 3.6 3.5 7.1C19 15.4 12 20 12 20z"/></svg>
      </button>
      <button class="cta" id="goStore" type="button" style="flex:1">Открыть в магазине ↗</button>
    </div>
  </div>
</section>

<script>
const CONFIG = {
  api: "https://zafgwbfgutlbudqevpal.supabase.co/functions/v1/guide-api",
};

const CATS = ["Верха","Низы","Верхняя одежда","Платья","Обувь","Сумки","Аксессуары","Бижутерия"];
const BODY = {hourglass:"Песочные часы",pear:"Груша",apple:"Яблоко",rectangle:"Прямоугольник",inv_triangle:"Перевёрнутый треугольник"};
const PRICES = [
  {k:"p1",t:"до 20 000 ₸",min:0,max:20000},
  {k:"p2",t:"20–40 000 ₸",min:20000,max:40000},
  {k:"p3",t:"40–70 000 ₸",min:40000,max:70000},
  {k:"p4",t:"70–120 000 ₸",min:70000,max:120000},
  {k:"p5",t:"от 120 000 ₸",min:120000,max:Infinity},
];
const SORTS = [{k:"def",t:"По подборке"},{k:"asc",t:"Сначала дешевле"},{k:"desc",t:"Сначала дороже"},{k:"sale",t:"Сначала скидки"}];
const COLOR_DOT = {"Чёрный":"#1B1717","Белый и молочный":"#F3EFE6","Бежевый":"#D6C2A3","Коричневый":"#6B4A33","Серый":"#9A9895","Синий и голубой":"#2E4E86","Красный и бордо":"#8E1B22","Зелёный и хаки":"#5E6B3A","Розовый":"#D9A1AE","Фиолетовый":"#6A3E7B","Жёлтый и оранжевый":"#D49A2A","Металлик":"linear-gradient(135deg,#C9B37E,#EDE3C7,#B0B3B8)","Принт":"conic-gradient(#8E1B22,#D49A2A,#2E4E86,#5E6B3A,#8E1B22)"};

const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
const qs = new URLSearchParams(location.search);
const previewToken = qs.get("preview");

let ITEMS = [];
const S = {cat:"all", sub:null, sort:"def", stores:new Set(), prices:new Set(), body:new Set(), mats:new Set(), colors:new Set(), base:false, trend:false, sale:false};
let draft = null;
let TAB = "shop"; // shop | list

let WISH = new Set();
try { WISH = new Set(JSON.parse(localStorage.getItem("ainur_guide_wish") || "[]")); } catch(e){}
function saveWish(){ try { localStorage.setItem("ainur_guide_wish", JSON.stringify([...WISH])); } catch(e){} }
function toggleWish(id){ WISH.has(id) ? WISH.delete(id) : WISH.add(id); saveWish(); updateWishUI(); const n = WISH.size, b = document.getElementById("lcount"); b.hidden = !n; b.textContent = n; }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => n == null ? "" : n.toLocaleString("ru-RU").replace(/,/g," ") + " ₸";
const plural = (n,a,b,c) => {const m=n%10,h=n%100; return n+" "+(m===1&&h!==11?a:(m>=2&&m<=4&&(h<12||h>14))?b:c);};

async function api(body){
  const payload = previewToken ? {preview:previewToken, ...body} : {initData: tg ? tg.initData : "", ...body};
  const r = await fetch(CONFIG.api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  let j = null; try { j = await r.json(); } catch(e) {}
  return {status:r.status, data:j};
}
function track(type,payload){ if(!tg && !previewToken) return; api({action:"event",type,payload}).catch(()=>{}); }
const trackDebounced = (()=>{let t; return (type,payload)=>{clearTimeout(t); t=setTimeout(()=>track(type,payload),1200);};})();

function setState(html){ $("#state").innerHTML = html; }

function skeleton(){
  setState(`<div class="grid">${Array.from({length:6},()=>`<div class="card"><div class="pic skel"></div><div class="body"><div class="skel" style="height:10px;width:40%;border-radius:6px"></div><div class="skel" style="height:14px;width:85%;border-radius:6px;margin-top:6px"></div><div class="skel" style="height:14px;width:30%;border-radius:6px;margin-top:14px"></div></div></div>`).join("")}</div>`);
}

async function boot(){
  if (tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor("#F4F3EF"); tg.setBackgroundColor("#F4F3EF"); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){} }
  if (!tg && !previewToken){
    setState(`<div class="state"><h2>Откройте гайд в Telegram</h2><p>Гайд работает внутри Telegram. Вернитесь в бот и нажмите кнопку «Открыть гайд».</p></div>`);
    return;
  }
  skeleton();
  let res;
  try { res = await api({action:"items"}); } catch(e){ res = {status:0}; }
  if (res.status === 200 && res.data && res.data.access){
    ITEMS = res.data.items || [];
    if (res.data.user && res.data.user.first_name) $("#brandCity").textContent = "Astana · " + res.data.user.first_name;
    setState("");
    initUI();
    showHome();
    $("#tabbar").hidden = false; $("#foot").hidden = false;
    return;
  }
  if (res.status === 200 && res.data && res.data.access === false){
    const pay = res.data.pay_url;
    setState(`<div class="state"><h2>Гайд откроется после оплаты</h2><p>Доступ привязан к вашему аккаунту Telegram. После оплаты вернитесь сюда, и подборка откроется.</p>${pay?`<button class="cta" id="payBtn" type="button">Оплатить доступ</button>`:""}</div>`);
    const b = $("#payBtn"); if (b) b.onclick = () => tg ? tg.openTelegramLink(pay) : location.assign(pay);
    return;
  }
  setState(`<div class="state"><h2>Не получилось загрузить</h2><p>Проверьте интернет и попробуйте ещё раз.</p><button class="ghost" type="button" onclick="location.reload()">Обновить</button></div>`);
}

function initUI(){
  $("#subs").onclick = e => { const b = e.target.closest("button"); if(!b) return; S.sub = S.sub === b.dataset.s ? null : b.dataset.s; renderBrowse(); };
  $("#veil").onclick = closeSheets;
  $("#reset").onclick = () => { draft = blank(); drawFilters(); };
  $("#apply").onclick = () => { Object.assign(S, draft); closeSheets(); renderBrowse(); markSelection(); track("filters", serialize()); };
  $("#activeRow").onclick = e => { const b = e.target.closest("button"); if(!b) return; removeActive(b.dataset.k, b.dataset.v); };
  $("#grid").onclick = cardClick; $("#grid").onkeydown = cardKey;
  $("#listGrid").onclick = cardClick; $("#listGrid").onkeydown = cardKey;
  $("#tabShop").onclick = () => { if (TAB === "shop") { window.scrollTo({top:0, behavior:"smooth"}); return; } TAB = "shop"; setTabs(); renderBrowse(); if (tg) tg.BackButton.hide(); };
  $("#tabList").onclick = () => { TAB = "list"; setTabs(); renderList(); window.scrollTo({top:0}); if (tg) tg.BackButton.show(); };
  $("#tabFilters").onclick = () => { if (TAB === "list") { TAB = "shop"; setTabs(); renderBrowse(); } openFilters(); };
  if (tg){ tg.BackButton.onClick(() => { if (document.querySelector(".sheet.on")) { closeSheets(); } else if (TAB === "list") { TAB = "shop"; setTabs(); renderBrowse(); tg.BackButton.hide(); } }); }
}

function cardClick(e){
  const h = e.target.closest(".heart");
  if (h){ e.stopPropagation(); toggleWish(+h.dataset.id); haptic(); renderActiveCards(); return; }
  const c = e.target.closest(".card"); if(!c) return; openDetail(+c.dataset.id);
}
function cardKey(e){
  if (e.key !== "Enter" && e.key !== " ") return;
  const c = e.target.closest(".card"); if(!c) return;
  e.preventDefault(); openDetail(+c.dataset.id);
}

function setTabs(){
  $("#tabShop").classList.toggle("on", TAB === "shop");
  $("#tabList").classList.toggle("on", TAB === "list");
  $("#home").hidden = TAB !== "shop";
  $("#listView").hidden = TAB !== "list";
}

function showHome(){ const lc = $("#lcount"); lc.hidden = !WISH.size; lc.textContent = WISH.size; TAB = "shop"; setTabs(); renderHome(); renderBrowse(); window.scrollTo({top:0}); if (tg) tg.BackButton.hide(); }

function renderHome(){
  const cats = CATS.filter(c => ITEMS.some(i => i.category === c));
  const tiles = cats.map(catTile).join("");
  $("#catGrid").innerHTML = tiles + tiles.replace(/<button /g, '<button aria-hidden="true" tabindex="-1" ');
  $("#catGrid").onclick = e => { const b = e.target.closest(".cat-tile"); if(!b) return; pickCategory(b.dataset.c); };
  startBand();
  const stores = [...new Set(ITEMS.map(i => i.store))].sort((a,b) => (a==="Другое")-(b==="Другое") || a.localeCompare(b));
  $("#storeScroller").innerHTML = stores.map(s => `<button type="button" class="store-chip" data-s="${esc(s)}">${esc(s)}</button>`).join("");
  $("#storeScroller").onclick = e => { const b = e.target.closest(".store-chip"); if(!b) return; pickStore(b.dataset.s); };
  markSelection();
}

// выбор категории/магазина меняет товары ниже на той же странице
function pickCategory(c){
  S.cat = S.cat === c ? "all" : c; S.sub = null;
  haptic(); markSelection(); renderBrowse(); nudgeToResults();
  track("category",{c:S.cat});
}
function pickStore(s){
  if (S.stores.size === 1 && S.stores.has(s)) S.stores.clear(); else S.stores = new Set([s]);
  haptic(); markSelection(); renderBrowse(); nudgeToResults();
  track("store",{s:[...S.stores]});
}
function markSelection(){
  document.querySelectorAll(".cat-tile").forEach(t => t.classList.toggle("on", t.dataset.c === S.cat));
  document.querySelectorAll(".store-chip").forEach(t => t.classList.toggle("on", S.stores.has(t.dataset.s)));
}
// если начало списка товаров ниже экрана — плавно подтягиваем его, чтобы было видно, что выбор сработал
function nudgeToResults(){
  const r = $("#results").getBoundingClientRect();
  const bottom = window.innerHeight - 80;
  if (r.top > bottom - 120) window.scrollBy({top: r.top - bottom + 260, behavior:"smooth"});
}

// бегущая лента: медленно едет влево, бесконечно (список продублирован),
// останавливается, пока человек листает пальцем, и продолжает через 3 секунды
let bandPausedUntil = 0, bandPos = 0;
function startBand(){
  const band = $("#catBand");
  if (!band || band.dataset.bound) return;
  band.dataset.bound = "1";
  const pause = () => { bandPausedUntil = performance.now() + 3000; };
  ["pointerdown","touchstart","wheel"].forEach(ev => band.addEventListener(ev, pause, {passive:true}));
  band.addEventListener("scroll", () => { if (performance.now() < bandPausedUntil) bandPos = band.scrollLeft; }, {passive:true});
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const step = now => {
    requestAnimationFrame(step);
    if (TAB !== "shop" || now < bandPausedUntil || document.querySelector(".sheet.on")) return;
    const half = band.scrollWidth / 2;
    if (!half) return;
    bandPos += 0.45;
    if (bandPos >= half) bandPos -= half;
    band.scrollLeft = bandPos;
  };
  requestAnimationFrame(step);
}

const tilePhoto = {};
function catTile(c){
  if (!(c in tilePhoto)){
    const pool = ITEMS.filter(i => i.category === c && i.image);
    tilePhoto[c] = pool.length ? pool[Math.floor(Math.random()*pool.length)].image : "";
  }
  const bg = tilePhoto[c] ? `style="background-image:url('${esc(tilePhoto[c])}')"` : "";
  return `<button type="button" class="cat-tile" data-c="${esc(c)}" ${bg}><span class="cat-tile-name">${esc(c)}</span></button>`;
}

function scrollTop(){ window.scrollTo({top:0}); }
function blank(){ return {stores:new Set(), prices:new Set(), body:new Set(), mats:new Set(), colors:new Set(), base:false, trend:false, sale:false, sort:S.sort}; }
function copyFilters(){ return {stores:new Set(S.stores), prices:new Set(S.prices), body:new Set(S.body), mats:new Set(S.mats), colors:new Set(S.colors), base:S.base, trend:S.trend, sale:S.sale, sort:S.sort}; }
function serialize(){ return {cat:S.cat, sub:S.sub, stores:[...S.stores], prices:[...S.prices], body:[...S.body], mats:[...S.mats], colors:[...S.colors], base:S.base, trend:S.trend, sale:S.sale, sort:S.sort}; }

function matches(i, F, skip){
  if (S.cat !== "all" && i.category !== S.cat) return false;
  if (S.sub && i.subcategory !== S.sub) return false;
  if (skip!=="stores" && F.stores.size && !F.stores.has(i.store)) return false;
  if (skip!=="prices" && F.prices.size && ![...F.prices].some(k => {const p=PRICES.find(x=>x.k===k); return i.price>=p.min && i.price<p.max;})) return false;
  if (skip!=="body" && F.body.size && !(i.body_types||[]).some(b => F.body.has(b))) return false;
  if (skip!=="mats" && F.mats.size && !(i.materials||[]).some(m => F.mats.has(m))) return false;
  if (skip!=="colors" && F.colors.size && !F.colors.has(i.color_family)) return false;
  if (F.base && F.trend) { if (!(i.base || i.trend)) return false; }
  else { if (F.base && !i.base) return false; if (F.trend && !i.trend) return false; }
  if (F.sale && !i.old_price) return false;
  return true;
}

function list(){
  const out = ITEMS.filter(i => matches(i, S));
  if (S.sort === "asc") out.sort((a,b) => (a.price??1e12)-(b.price??1e12));
  else if (S.sort === "desc") out.sort((a,b) => (b.price??0)-(a.price??0));
  else if (S.sort === "sale") out.sort((a,b) => (b.old_price?1:0)-(a.old_price?1:0) || a.sort-b.sort);
  return out;
}

function activeCount(F){ return F.stores.size+F.prices.size+F.body.size+F.mats.size+F.colors.size+(F.base?1:0)+(F.trend?1:0)+(F.sale?1:0); }

function renderBrowse(){
  const subs = S.cat === "all" ? [] : [...new Set(ITEMS.filter(i => i.category === S.cat && i.subcategory).map(i => i.subcategory))];
  $("#subs").hidden = subs.length < 2;
  $("#subs").innerHTML = subs.map(s => `<button type="button" class="chip${S.sub===s?" on":""}" data-s="${esc(s)}">${esc(s)}</button>`).join("");

  const act = [];
  S.stores.forEach(v => act.push(["stores",v,v]));
  S.prices.forEach(v => act.push(["prices",v,PRICES.find(p=>p.k===v).t]));
  S.body.forEach(v => act.push(["body",v,BODY[v]]));
  S.mats.forEach(v => act.push(["mats",v,v]));
  S.colors.forEach(v => act.push(["colors",v,v]));
  if (S.base) act.push(["base","1","База"]);
  if (S.trend) act.push(["trend","1","Тренд"]);
  if (S.sale) act.push(["sale","1","Со скидкой"]);
  $("#activeRow").hidden = !act.length;
  $("#activeRow").innerHTML = act.map(([k,v,t]) => `<button type="button" class="chip on" data-k="${k}" data-v="${esc(v)}">${esc(t)}<span class="x">×</span></button>`).join("");
  const n = activeCount(S); $("#fcount").hidden = !n; $("#fcount").textContent = n;

  const L = list();
  $("#count").hidden = false;
  $("#count").textContent = (S.cat === "all" ? "Все вещи" : S.cat) + " · " + plural(L.length,"вещь","вещи","вещей");
  $("#grid").innerHTML = L.length ? L.map(card).join("") : `<div class="state" style="grid-column:1/-1;padding:40px 10px"><h2>Ничего не нашлось</h2><p>Попробуйте другую категорию или уберите часть фильтров.</p><button class="ghost" type="button" id="clearAll">Сбросить всё</button></div>`;
  const ca = $("#clearAll"); if (ca) ca.onclick = () => { Object.assign(S, blank()); S.cat = "all"; S.sub = null; markSelection(); renderBrowse(); };
  bindImgs($("#grid"));
}

function bindImgs(root){
  root.querySelectorAll("img").forEach(img => { if (img.complete && img.naturalWidth) img.classList.add("ok"); img.onload = () => img.classList.add("ok"); img.onerror = () => { img.closest(".pic") && img.closest(".pic").classList.add("noimg"); }; });
}

function card(i){
  const badges = [];
  if (i.promo_label) badges.push(`<span class="badge sale">${esc(i.promo_label)}</span>`);
  if (i.trend) badges.push(`<span class="badge trend">Тренд</span>`);
  if (i.base) badges.push(`<span class="badge">База</span>`);
  const on = WISH.has(i.id);
  return `<div class="card" tabindex="0" role="button" data-id="${i.id}">
    <div class="pic"><img alt="${esc(i.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(i.image)}">${badges.length?`<div class="badges">${badges.join("")}</div>`:""}
      <button type="button" class="heart${on?" on":""}" data-id="${i.id}" aria-label="В список покупок"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9.5-8.9C.7 7.6 2.4 4 6 4c2 0 3.5 1.1 4.5 2.4C11.5 5.1 13 4 15 4c3.6 0 5.3 3.6 3.5 7.1C19 15.4 12 20 12 20z"/></svg></button>
    </div>
    <div class="body"><span class="store">${esc(i.store)}</span><h3>${esc(i.name)}</h3>${i.color?`<span class="col">${esc(i.color)}</span>`:""}
    <div class="row"><span class="price">${money(i.price)}</span>${i.old_price?`<span class="old">${money(i.old_price)}</span>`:""}</div></div></div>`;
}

// сердечко переключаем на месте, без перерисовки сетки — страница не прыгает
function renderActiveCards(){
  document.querySelectorAll("#grid .heart").forEach(h => h.classList.toggle("on", WISH.has(+h.dataset.id)));
  if (TAB === "list") renderList();
}

function renderList(){
  const n = WISH.size; $("#lcount").hidden = !n; if (n) $("#lcount").textContent = n;
  const items = ITEMS.filter(i => WISH.has(i.id));
  if (!items.length){
    $("#listGrid").className = "";
    $("#listGrid").innerHTML = `<div class="state"><h2>Список пуст</h2><p>Добавляйте вещи сердечком на карточке — соберём их здесь для похода по магазинам.</p></div>`;
    return;
  }
  $("#listGrid").className = "grid";
  $("#listGrid").innerHTML = items.map(card).join("");
  bindImgs($("#listGrid"));
}

function removeActive(k,v){
  if (["base","trend","sale"].includes(k)) S[k] = false; else S[k].delete(v);
  markSelection(); renderBrowse(); track("filters", serialize());
}

/* --- filters sheet --- */
function openFilters(){ draft = copyFilters(); drawFilters(); openSheet("#fsheet"); track("open_filters"); }
function opt(group,value,label,count,on,dot){
  return `<button type="button" class="chip${on?" on":""}" data-g="${group}" data-v="${esc(value)}"${count===0&&!on?" disabled":""}>${dot?`<span style="display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:${dot};box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)"></span>`:""}${esc(label)}<small>${count}</small></button>`;
}
function drawFilters(){
  const cnt = (skip, pred) => ITEMS.filter(i => matches(i, draft, skip) && pred(i)).length;
  const stores = [...new Set(ITEMS.map(i => i.store))].sort();
  const mats = ["Кашемир","Шерсть","Шёлк","Хлопок","Лён","Вискоза","Кожа и замша","Синтетика","Металл"].filter(m => ITEMS.some(i => (i.materials||[]).includes(m)));
  const colors = Object.keys(COLOR_DOT).filter(c => ITEMS.some(i => i.color_family === c));
  const hasBody = ITEMS.some(i => (i.body_types||[]).length);
  const hasBase = ITEMS.some(i => i.base), hasTrend = ITEMS.some(i => i.trend), hasSale = ITEMS.some(i => i.old_price);
  let h = "";
  h += `<div class="fgroup"><h4>Сортировка</h4><div class="opts">${SORTS.map(s => `<button type="button" class="chip${draft.sort===s.k?" on":""}" data-sort="${s.k}">${esc(s.t)}</button>`).join("")}</div></div>`;
  if (hasBody) h += `<div class="fgroup"><h4>Тип фигуры</h4><div class="opts">${Object.entries(BODY).map(([k,t]) => opt("body",k,t,cnt("body",i=>(i.body_types||[]).includes(k)),draft.body.has(k))).join("")}</div></div>`;
  h += `<div class="fgroup"><h4>Цена</h4><div class="opts">${PRICES.map(p => opt("prices",p.k,p.t,cnt("prices",i=>i.price>=p.min&&i.price<p.max),draft.prices.has(p.k))).join("")}</div></div>`;
  h += `<div class="fgroup"><h4>Магазин</h4><div class="opts">${stores.map(s => opt("stores",s,s,cnt("stores",i=>i.store===s),draft.stores.has(s))).join("")}</div></div>`;
  h += `<div class="fgroup"><h4>Состав</h4><div class="opts">${mats.map(m => opt("mats",m,m,cnt("mats",i=>(i.materials||[]).includes(m)),draft.mats.has(m))).join("")}</div></div>`;
  h += `<div class="fgroup"><h4>Цвет</h4><div class="opts">${colors.map(c => opt("colors",c,c,cnt("colors",i=>i.color_family===c),draft.colors.has(c),COLOR_DOT[c])).join("")}</div></div>`;
  const tog = (k,label) => `<div class="toggle"><span>${label}</span><button type="button" class="sw${draft[k]?" on":""}" data-t="${k}" aria-pressed="${draft[k]}" aria-label="${label}"></button></div>`;
  let t = "";
  if (hasBase) t += tog("base","База гардероба");
  if (hasTrend) t += tog("trend","Тренды сезона");
  if (hasSale) t += tog("sale","Только со скидкой");
  if (t) h += `<div class="fgroup"><h4>Подборка</h4>${t}</div>`;
  $("#fbody").innerHTML = h;
  const total = ITEMS.filter(i => matches(i, draft)).length;
  $("#apply").textContent = total ? "Показать " + plural(total,"вещь","вещи","вещей") : "Ничего не найдено";
  $("#fbody").onclick = e => {
    const sb = e.target.closest("[data-sort]"); if (sb){ draft.sort = sb.dataset.sort; haptic(); drawFilters(); return; }
    const c = e.target.closest(".chip[data-g]");
    if (c && !c.disabled){ const set = draft[c.dataset.g]; set.has(c.dataset.v) ? set.delete(c.dataset.v) : set.add(c.dataset.v); haptic(); drawFilters(); return; }
    const s = e.target.closest(".sw"); if (s){ draft[s.dataset.t] = !draft[s.dataset.t]; haptic(); drawFilters(); }
  };
}

/* --- detail sheet --- */
let current = null;
function updateWishUI(){
  if (!current) return;
  $("#dWish").classList.toggle("on", WISH.has(current.id));
}
function openDetail(id){
  const i = ITEMS.find(x => x.id === id); if (!i) return;
  current = i;
  const facts = [];
  if (i.color) facts.push(["Цвет", i.color]);
  if (i.composition) facts.push(["Состав", i.composition]);
  if ((i.body_types||[]).length) facts.push(["Фигура", i.body_types.map(b => BODY[b]).join(", ")]);
  const tags = [i.trend&&"Тренд", i.base&&"База", i.promo_label&&("Скидка "+i.promo_label)].filter(Boolean);
  $("#dbody").innerHTML = `
    <div class="pic"><img alt="${esc(i.name)}" referrerpolicy="no-referrer" src="${esc(i.image)}"></div>
    <div class="store d-store">${esc(i.store)} · ${esc(i.subcategory || i.category)}</div>
    <div class="d-name">${esc(i.name)}</div>
    <div class="d-price"><span class="price">${money(i.price)}</span>${i.old_price?`<span class="old">${money(i.old_price)}</span>`:""}</div>
    ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
    ${i.comment?`<div class="note"><b>Комментарий стилиста.</b> ${esc(i.comment)}</div>`:""}
    ${facts.length?`<div class="facts">${facts.map(([k,v]) => `<div><b>${k}</b><span>${esc(v)}</span></div>`).join("")}</div>`:""}
    <p class="fine">Цена и наличие — на момент подборки, на сайте магазина могут отличаться.</p>`;
  updateWishUI();
  openSheet("#dsheet");
  track("item_open",{id:i.id});
}
$("#dWish").onclick = () => { if (!current) return; toggleWish(current.id); haptic(); renderActiveCards(); };
$("#goStore").onclick = () => {
  if (!current) return;
  track("store_click",{id:current.id, store:current.store});
  if (tg) tg.openLink(current.url); else window.open(current.url, "_blank", "noopener");
};

function openSheet(sel){
  closeSheets(true);
  $("#veil").classList.add("on"); $(sel).classList.add("on"); $(sel).setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
  if (tg) tg.BackButton.show();
}
function closeSheets(silent){
  document.querySelectorAll(".sheet.on").forEach(s => { s.classList.remove("on"); s.setAttribute("aria-hidden","true"); });
  $("#veil").classList.remove("on");
  document.body.style.overflow = "";
  if (tg && silent !== true && TAB !== "list") tg.BackButton.hide();
}
function haptic(){ try{ tg && tg.HapticFeedback.selectionChanged(); }catch(e){} }

boot();
</script>
</body>
