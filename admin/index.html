<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Клиенты бота</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#F2F2F6;--card:#fff;--ink:#0E0E10;--ink-2:#55555C;--ink-3:#9A9AA2;--fill:#E8E8EE;--wine:#7A1C2C;--wine-soft:#F4E7E9;--sans:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom,0px))}
h1{margin:6px 2px 14px;font:700 26px/1.1 var(--sans);letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:18px;padding:12px 12px 11px}
.stat b{display:block;font:700 22px/1.1 var(--sans);letter-spacing:-.02em}
.stat span{display:block;margin-top:4px;font:500 11.5px/1.25 var(--sans);color:var(--ink-3)}
.stat.hl b{color:var(--wine)}
.panel{background:var(--card);border-radius:22px;padding:14px;margin-bottom:12px}
.lab{display:block;margin:0 0 7px;font:600 12px/1 var(--sans);color:var(--ink-3)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
select,input[type=date]{width:100%;height:42px;padding:0 12px;border:0;border-radius:12px;background:var(--fill);color:var(--ink);font:500 15px var(--sans);appearance:none;-webkit-appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{padding:8px 12px;border:0;border-radius:999px;background:var(--fill);color:var(--ink-2);font:600 13px/1 var(--sans);cursor:pointer}
.chip.on{background:var(--wine);color:#fff}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font:500 14px var(--sans);color:var(--ink-2);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--wine)}
.btn{width:100%;height:46px;margin-top:12px;border:0;border-radius:14px;background:var(--wine);color:#fff;font:600 15px var(--sans);cursor:pointer}
.btn.alt{background:var(--fill);color:var(--ink)}
.btn:disabled{opacity:.6}
.cap{margin:4px 4px 10px;font:500 13px/1.3 var(--sans);color:var(--ink-3)}
.list{display:flex;flex-direction:column;gap:8px}
.cl{background:var(--card);border-radius:18px;padding:12px 14px}
.cl h4{margin:0;font:600 15px/1.25 var(--sans)}
.cl h4 small{font:500 13px var(--sans);color:var(--ink-3);margin-left:6px}
.cl p{margin:4px 0 0;font:400 12.5px/1.45 var(--sans);color:var(--ink-2)}
.st{display:inline-block;margin-top:7px;padding:4px 9px;border-radius:999px;font:600 11px/1 var(--sans);background:var(--fill);color:var(--ink-2)}
.st.ok{background:var(--wine-soft);color:var(--wine)}
.st.bad{background:#FBE9E7;color:#B3261E}
.empty,.err{padding:28px 10px;text-align:center;color:var(--ink-3)}
.note{margin:14px 4px 0;font:400 12px/1.45 var(--sans);color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Клиенты бота</h1>
  <div class="stats">
    <div class="stat"><b id="sAll">–</b><span>всего в картотеке</span></div>
    <div class="stat"><b id="sSel">–</b><span>по выбранным датам</span></div>
    <div class="stat hl"><b id="sReach">–</b><span>им можно писать</span></div>
  </div>

  <div class="panel">
    <span class="lab">Дата, по которой выбираем</span>
    <select id="field">
      <option value="created_at">Первый контакт (когда впервые открыл)</option>
      <option value="started_at">Когда нажал «Старт» в боте</option>
      <option value="last_seen_at">Последний визит</option>
    </select>
    <div class="row" style="margin-top:12px">
      <div><span class="lab">С</span><input type="date" id="from"></div>
      <div><span class="lab">По</span><input type="date" id="to"></div>
    </div>
    <div class="chips" id="quick">
      <button class="chip" data-d="0">Сегодня</button>
      <button class="chip" data-d="7">7 дней</button>
      <button class="chip" data-d="30">30 дней</button>
      <button class="chip on" data-d="all">Всё время</button>
    </div>
    <div class="chips" id="sortc" style="margin-top:12px">
      <button class="chip on" data-dir="desc">Сначала новые</button>
      <button class="chip" data-dir="asc">Сначала старые</button>
    </div>
    <label class="chk"><input type="checkbox" id="reach"> Только те, кому можно писать</label>
    <button class="btn" id="exp">⬇ Выгрузить список в чат</button>
  </div>

  <div class="cap" id="cap"></div>
  <div class="list" id="list"></div>
  <p class="note">Время указано по Астане. «Можно писать» — те, кто нажал «Старт» в боте и не заблокировал его: только им бот может отправить рассылку. Остальные пока только открывали приложение.</p>
</div>
<script>
const API = "https://zafgwbfgutlbudqevpal.supabase.co/functions/v1/guide-bot";
const tg = window.Telegram && Telegram.WebApp;
const PREVIEW = new URLSearchParams(location.search).get("preview");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = {dir:"desc"};

async function api(body){
  const payload = PREVIEW ? {preview:PREVIEW, ...body} : {initData: tg ? tg.initData : "", ...body};
  const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
  let j = null; try { j = await r.json(); } catch(e){}
  return {status:r.status, data:j};
}
const today = () => new Intl.DateTimeFormat("sv-SE", {timeZone:"Asia/Almaty"}).format(new Date());
const shift = n => new Intl.DateTimeFormat("sv-SE", {timeZone:"Asia/Almaty"}).format(new Date(Date.now() - n*86400000));
const params = () => ({field:$("#field").value, from:$("#from").value || null, to:$("#to").value || null, dir:state.dir, reach:$("#reach").checked});
const plural = (n,a,b,c) => { const m=n%10, h=n%100; return m===1&&h!==11?a:(m>=2&&m<=4&&(h<10||h>=20)?b:c); };

async function load(){
  $("#list").innerHTML = ""; $("#cap").textContent = "Загружаю…";
  const r = await api({action:"clients", ...params()});
  if (r.status !== 200 || !r.data){
    $("#cap").textContent = "";
    $("#list").innerHTML = `<div class="err">${r.status===403||r.status===401?"Этот раздел только для админов.":"Не получилось загрузить. Попробуйте ещё раз."}</div>`;
    return;
  }
  const d = r.data;
  $("#sAll").textContent = d.all; $("#sSel").textContent = d.total; $("#sReach").textContent = d.reach;
  $("#cap").textContent = d.total ? `${d.total} ${plural(d.total,"человек","человека","человек")}${d.shown<d.total?` (показаны первые ${d.shown}, в выгрузке будут все)`:""}` : "";
  $("#list").innerHTML = d.total ? d.rows.map(u => {
    const cls = u.status === "можно писать" ? "ok" : (u.status.startsWith("заблок") ? "bad" : "");
    return `<div class="cl"><h4>${esc(u.name || "Без имени")}${u.username?`<small>@${esc(u.username)}</small>`:""}</h4>
      <p>Первый контакт: ${esc(u.created)}${u.started?`<br>Нажал «Старт»: ${esc(u.started)}`:""}<br>Последний визит: ${esc(u.seen)}${u.src?`<br>Источник: ${esc(u.src)}`:""}</p>
      <span class="st ${cls}">${esc(u.status)}</span></div>`;
  }).join("") : `<div class="empty">Никого за этот период.</div>`;
}

function setQuick(k){
  document.querySelectorAll("#quick .chip").forEach(c => c.classList.toggle("on", c.dataset.d === k));
}
$("#quick").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const k = b.dataset.d; setQuick(k);
  if (k === "all"){ $("#from").value = ""; $("#to").value = ""; }
  else { $("#from").value = shift(+k); $("#to").value = today(); }
  load();
});
["from","to"].forEach(id => $("#"+id).addEventListener("change", () => { setQuick(""); load(); }));
$("#field").addEventListener("change", load);
$("#reach").addEventListener("change", load);
$("#sortc").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.dir = b.dataset.dir;
  document.querySelectorAll("#sortc .chip").forEach(c => c.classList.toggle("on", c === b));
  load();
});
$("#exp").addEventListener("click", async () => {
  const b = $("#exp"), t = b.textContent; b.disabled = true; b.textContent = "Готовлю файл…";
  try {
    const r = await api({action:"export_clients", ...params()});
    if (r.status === 200 && r.data && r.data.ok){
      if (r.data.csv){ // обычный браузер: скачиваем файл
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([r.data.csv], {type:"text/csv;charset=utf-8"}));
        a.download = "клиенты-" + today() + ".csv"; document.body.appendChild(a); a.click(); a.remove();
        b.textContent = "Файл скачан";
      } else b.textContent = "Отправил файл в чат с ботом";
    } else b.textContent = "Не получилось, попробуйте ещё";
  } catch(e){ b.textContent = "Не получилось, попробуйте ещё"; }
  setTimeout(() => { b.textContent = t; b.disabled = false; }, 3000);
});

if (tg){
  tg.ready(); tg.expand();
  try{ tg.setHeaderColor("#F2F2F6"); tg.setBackgroundColor("#F2F2F6"); }catch(e){}
  if (tg.BackButton){ tg.BackButton.show(); tg.BackButton.onClick(() => { location.href = "../hub/"; }); }
}
load();
</script>
</body>
</html>
